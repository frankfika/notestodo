[package]
name = "shibei"
version = "0.1.0"
description = "拾贝 Shibei — AI 会议笔记与三级待办（本地优先，BYOK）"
authors = ["fangchen"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shibei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# Phase-3: knowledge folder reindex — local .md/.txt walk + folder picker.
# Plugins are no-op on non-mac targets; capability scope is narrowed to
# $HOME + standard note dirs (no "**"). Dialog-picked paths gain access via
# the OS security-scoped resource tracker, not via static scope widening.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
