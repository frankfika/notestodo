[package]
name = "shibei"
version = "0.3.0"
description = "拾贝 Shibei — AI 会议笔记与三级待办（本地优先，BYOK）"
authors = ["fangchen"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shibei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# Phase-3: knowledge folder reindex — local .md/.txt walk + folder picker.
# Plugins are no-op on non-mac targets; capability scope is narrowed to
# $HOME + standard note dirs (no "**"). Dialog-picked paths gain access via
# the OS security-scoped resource tracker, not via static scope widening.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tiny_http = "0.12.0"

# Phase-3 Gap 1: macOS-only ScreenCaptureKit audio capture.
# screencapturekit-sys pulls in block / dispatch / objc / objc-foundation /
# objc_id / once_cell — none require Xcode's Swift toolchain. The higher-level
# `screencapturekit` 11.x crate pulls apple-cf + swift-bridge which need full
# Xcode; on a CommandLineTools-only machine its build script fails. So we
# keep the FFI surface narrow via the *-sys crate and a thin wrapper.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit-sys = "0.2"
objc = "0.2.7"
objc_id = "0.1.1"

# 应用内置本地模型（Foresight 式）：模型下载 + 进程内推理，不依赖 Ollama 等外部服务。
# whisper-rs / llama-cpp-2 用 cmake 编 whisper.cpp / llama.cpp；Metal 内嵌着色器源码运行时编译，无需完整 Xcode。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
whisper-rs = { version = "0.16", features = ["metal"] }
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }
# 渲染模型自带的 Jinja chat 模板（Gemma 4 等新格式）
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
# 说话人区分：pyannote 分段 + 3D-Speaker 声纹（静态链接预编译库；离线构建可设 SHERPA_ONNX_ARCHIVE_DIR）
sherpa-onnx = "1.13.8"
