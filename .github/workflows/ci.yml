name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端构建 + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm build

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts 里的 webServer 会自动起 dev server
      - name: e2e 测试
        run: pnpm exec playwright test
        env:
          SHIBEI_URL: http://127.0.0.1:5173/

  rust:
    name: Rust 桌面壳检查（${{ matrix.os }}）
    # 内置模型依赖 macOS 专属 crate（whisper-rs / llama-cpp-2 / sherpa-onnx）；
    # Windows 走 src/builtin_stub.rs 桩，两个平台都要能编。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: cargo check
        working-directory: web/src-tauri
        run: cargo check
