name: Release

# 打 tag v* 触发：多平台打包（macOS arm64 / Windows x64）并创建 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag（不含 v 前缀也可以）'
        required: true
        default: 'v0.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows (x64)
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup 的 standalone 自安装器取 @pnpm/exe 二进制，
      # 11.12.0 该构建残缺（ERR_PNPM_BROKEN_PNPM_RELEASE），与 ci.yml 同口径改用 npm 装
      - name: 安装 pnpm
        run: npm install -g pnpm@11.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ── macOS ──────────────────────────────────────────────
      - name: 装 Rust (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # 没有 Apple 证书：ad-hoc 签名（identity "-"），产物仍可安装（需右键打开 / 系统设置放行）。
      # APPLE_CERTIFICATE 必须整行不设——设成空串 bundler 也会去 keychain import 然后崩。
      - name: 打包 macOS
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CARGO_TAURI_BUNDLER_TOOLS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 自动更新签名（公钥在 tauri.conf.json；私钥只在仓库 secret）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: openNotion-macos
          path: |
            web/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig

      # ── Windows ────────────────────────────────────────────
      - name: 装 Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: 22

      # windows-latest 镜像已自带 WebView2 运行时，choco 上的 webview2 包也已下架，不装

      - name: 打包 Windows
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: openNotion-windows
          path: |
            web/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            web/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.sig' \) -print

      # Tauri 自动更新清单：app 启动时拉取 releases/latest/download/latest.json 比对版本。
      # darwin 用 .app.tar.gz + .sig；windows 用 NSIS 安装包 + .exe.sig。
      - name: 生成 latest.json
        env:
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          BASE="https://github.com/frankfika/notestodo/releases/download/${TAG}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAC_PKG="$(find artifacts/openNotion-macos -name '*.app.tar.gz' | head -1)"
          MAC_SIG="$(find artifacts/openNotion-macos -name '*.app.tar.gz.sig' | head -1)"
          WIN_PKG="$(find artifacts/openNotion-windows -name '*-setup.exe' -o -name '*_setup.exe' | head -1)"
          WIN_SIG="$(find artifacts/openNotion-windows -name '*.exe.sig' | head -1)"
          [[ -n "$MAC_PKG" && -n "$MAC_SIG" ]] || { echo "缺 macOS 更新产物"; exit 1; }

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$BASE" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_url "$BASE/$(basename "$MAC_PKG")" \
            --arg mac_sig "$(cat "$MAC_SIG")" \
            --arg win_url "${WIN_PKG:+$(basename "$WIN_PKG")}" \
            --arg win_sig "${WIN_SIG:+$(cat "$WIN_SIG")}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ({
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              } + (if $win_url != "" and $win_sig != "" then
                    { "windows-x86_64": { signature: $win_sig, url: ($notes + "/" + $win_url) } }
                  else {} end))
            }' > latest.json
          echo "── latest.json ──"
          cat latest.json

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.app.tar.gz
            latest.json
          body: |
            ## openNotion ${{ github.event.inputs.tag_name || github.ref_name }}

            本地优先的 AI 工作区：会议速记 × Notion 式笔记 × 任务看板。

            - **macOS**：下载 .dmg 拖入「应用程序」；未签名版本首次打开需右键 → 打开
            - **Windows**：下载 .exe 安装（需 WebView2 运行时，系统一般已自带）
            - **自动更新**：发布为正式版后，桌面 app 启动会自检并提示更新（`latest.json` 已随本 Release 附带）

            数据全在本机，导出 .zip 即可迁移。详见仓库 README 与 RELEASE_NOTES.md。
