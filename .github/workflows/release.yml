name: Release

# 打 tag v* 触发：多平台打包（macOS arm64 / Windows x64）并创建 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag（不含 v 前缀也可以）'
        required: true
        default: 'v0.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows (x64)
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ── macOS ──────────────────────────────────────────────
      - name: 装 Rust (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # 没有 Apple 证书：ad-hoc 签名（identity "-"），产物仍可安装（需右键打开 / 系统设置放行）。
      # APPLE_CERTIFICATE 必须整行不设——设成空串 bundler 也会去 keychain import 然后崩。
      - name: 打包 macOS
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CARGO_TAURI_BUNDLER_TOOLS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: openNotion-macos
          path: |
            web/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      # ── Windows ────────────────────────────────────────────
      - name: 装 Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22

      # windows-latest 镜像已自带 WebView2 运行时，choco 上的 webview2 包也已下架，不装

      - name: 打包 Windows
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: openNotion-windows
          path: web/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          body: |
            ## openNotion ${{ github.event.inputs.tag_name || github.ref_name }}

            本地优先的 AI 工作区：会议速记 × Notion 式笔记 × 任务看板。

            - **macOS**：下载 .dmg 拖入「应用程序」；未签名版本首次打开需右键 → 打开
            - **Windows**：下载 .exe 安装（需 WebView2 运行时，系统一般已自带）

            数据全在本机，导出 .zip 即可迁移。详见仓库 README 与 RELEASE_NOTES.md。
